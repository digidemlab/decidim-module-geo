services:
  decidim-geo:
    container_name: decidim-geo
    entrypoint: ""
    build: .
    environment:
      - RAILS_ENV=development
      - NODE_ENV=development
      - RAILS_SERVE_STATIC_FILES=true
      - DATABASE_URL=postgis://decidim:insecure-password@pg:5432/decidim
      - SECRET_KEY_BASE=0cfe5cc502a5fbcf0718ad8c96f7872270e655ffd11d857395abef0bb7f4dad7307fc9d97f2c971bc6a9c385b2eaf629b1e410cc5936c89a21548e30767e6fbf
      - DECIDIM_SYSTEM_PASSWORD=decidim123456
      - DECIDIM_SYSTEM_EMAIL=system@example.org
      - WEB_CONCURRENCY=0
      - RAILS_MAX_THREADS=2
      - RAILS_MIN_THREADS=1
      - RAILS_FORCE_SSL=false
      - DECIDIM_FORCE_SSL=false
    depends_on:
      pg:
        condition: service_healthy
    links:
      - pg
    ports:
      - 3000:3000
      - 3035:3035
    volumes:
      - .:/home/decidim_module_geo
      - ../decidim-toggle:/home/decidim-toggle
      - node_modules:/home/decidim/node_modules
      - bundle:/home/decidim/vendor
      - public:/home/decidim/public
      - tmp:/home/decidim/tmp
      - .docker/dump/:/home/decidim/tmp/dump
    networks:
      - private
      - default

  pg:
    image: postgis/postgis:17-3.5-alpine
    restart: always
    volumes:
      - pg_data:/var/lib/postgresql/data
      - .docker/dump:/tmp/dump
    environment:
      - POSTGRES_PASSWORD=insecure-password
      - POSTGRES_USER=decidim
      - POSTGRES_DB=decidim
    networks:
      - private
    ports:
      - 5432:5432
    healthcheck:
      test: pg_isready -U decidim -h 127.0.0.1
      interval: 5s

volumes:
  bundle: {}
  pg_data: {}
  public: {}
  node_modules: {}
  tmp: {}
networks:
  private:
    internal: true
